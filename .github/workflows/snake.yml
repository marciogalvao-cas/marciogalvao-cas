# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica os SVGs na branch "output", lida pelo README do perfil.
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12 horas: acompanha os dias novos
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write             # para gravar na branch output

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # lê o gráfico de contribuições e desenha a cobrinha nas cores da CAS
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#004C97&color_dots=#ebedf0,#b9f5d0,#6ee7a8,#1fe07a,#00b140
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#18C6F0&color_dots=#161b22,#0e4429,#006d32,#1fe07a,#39d353

      # publica a pasta dist na branch output
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
